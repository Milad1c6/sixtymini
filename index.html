<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>فروشگاه</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080f;--g1:rgba(255,255,255,.055);--g2:rgba(255,255,255,.1);--line:rgba(255,255,255,.1);--tx:#f5f7ff;--mut:#98a1c8;--a:#6d8dff;--b:#b46cff;--c:#2ee6c5;--gold:#ffc65c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,system-ui,sans-serif}
body{padding:0 16px calc(40px + env(safe-area-inset-bottom));overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
.blob{position:fixed;z-index:-2;border-radius:50%;filter:blur(100px);opacity:.5;animation:fl 16s ease-in-out infinite alternate}
.blob.a{width:360px;height:360px;background:#3c55ff;top:-120px;right:-100px}
.blob.b{width:320px;height:320px;background:#9b30ff;bottom:-100px;left:-110px;animation-delay:-7s}
.blob.c{width:220px;height:220px;background:#00d5b4;top:42%;left:-120px;opacity:.22;animation-delay:-3s}
@keyframes fl{to{transform:translate(50px,70px) scale(1.2)}}

/* splash */
#splash{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s,visibility .6s}
#splash.off{opacity:0;visibility:hidden}
.orb{width:84px;height:84px;border-radius:28px;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 0 0 rgba(109,141,255,.6);animation:pulse 1.6s infinite,pop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes pulse{to{box-shadow:0 0 0 34px rgba(109,141,255,0)}}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
#splash b{font-size:20px;letter-spacing:.5px;animation:up .8s .2s both}

/* header */
header{display:flex;align-items:center;gap:13px;padding:22px 2px 6px}
.logo{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 24px rgba(140,108,255,.45);flex:none}
header h1{margin:0;font-size:21px;font-weight:900}
header p{margin:2px 0 0;color:var(--mut);font-size:12.5px}
.live{margin-inline-start:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--c);background:rgba(46,230,197,.1);border:1px solid rgba(46,230,197,.25);padding:5px 10px;border-radius:99px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--c);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

/* hero marquee */
.hero{margin:16px 0 8px;padding:18px;border-radius:24px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(109,141,255,.25),rgba(180,108,255,.2));border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%);transform:translateX(120%);animation:shine 4.5s infinite}
@keyframes shine{to{transform:translateX(-120%)}}
.hero h2{margin:0 0 4px;font-size:19px;font-weight:800}
.hero p{margin:0;color:#d4dbff;font-size:12.5px;opacity:.85}
.perks{display:flex;gap:8px;margin-top:14px}
.perk{flex:1;text-align:center;font-size:11px;padding:9px 4px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.perk b{display:block;font-size:17px;margin-bottom:2px}

/* tabs */
.tabs{position:sticky;top:8px;z-index:5;display:flex;padding:5px;margin:16px 0;border-radius:20px;background:rgba(14,16,30,.7);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.tabs .ind{position:absolute;top:5px;bottom:5px;width:calc(50% - 5px);border-radius:15px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 22px rgba(109,141,255,.45);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.tab{position:relative;flex:1;border:0;background:none;color:var(--mut);font:700 14px Vazirmatn;padding:12px 0;transition:color .25s}
.tab.on{color:#fff}

/* plan cards */
.list{display:flex;flex-direction:column;gap:12px}
.plan{position:relative;display:flex;align-items:center;gap:14px;padding:16px;border-radius:24px;background:var(--g1);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);opacity:0;transform:translateY(18px) scale(.97);animation:up .55s cubic-bezier(.2,.9,.3,1) forwards;transition:transform .18s,border-color .25s,background .25s}
.plan:active{transform:scale(.97);background:var(--g2)}
@keyframes up{to{opacity:1;transform:none}}
.plan.best{border-color:transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(135deg,var(--gold),var(--b),var(--a),var(--c),var(--gold)) border-box;background-size:100% 100%,300% 300%;animation:up .55s forwards,rot 6s linear infinite}
@keyframes rot{to{background-position:0 0,300% 300%}}
.badge{position:absolute;top:-10px;inset-inline-start:16px;font-size:10.5px;font-weight:800;color:#2a1c00;background:linear-gradient(135deg,#ffe29a,var(--gold));padding:3px 11px;border-radius:99px;box-shadow:0 4px 14px rgba(255,198,92,.45)}
.ring{width:62px;height:62px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .bgc{stroke:rgba(255,255,255,.09)}
.ring .fg{stroke:url(#grad);stroke-dasharray:176;stroke-dashoffset:176;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.9,.3,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:900;line-height:1;text-align:center}
.ring span small{display:block;font-size:8.5px;color:var(--mut);font-weight:400;margin-top:2px}
.info{flex:1;min-width:0}
.info b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.chip{font-size:11px;color:var(--mut);background:rgba(255,255,255,.07);padding:3px 9px;border-radius:99px}
.price{text-align:left;flex:none}
.price b{display:block;font-size:17px;font-weight:900}
.price small{font-size:10.5px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:60px 0}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:.35s;z-index:10}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:92vh;overflow:auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(28,31,56,.92),rgba(14,16,30,.96));border-top:1px solid rgba(255,255,255,.16);border-radius:32px 32px 0 0;backdrop-filter:blur(34px);-webkit-backdrop-filter:blur(34px);transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.grab{width:46px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin:0 auto 16px;touch-action:none}
.sh-top{display:flex;align-items:center;gap:14px}
.sh-top .ring{width:70px;height:70px}
.sh-top h2{margin:0;font-size:19px;font-weight:800}
.sh-top p{margin:4px 0 0;color:var(--mut);font-size:12.5px}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:22px 0 10px;color:var(--mut)}
.lbl b{color:var(--tx);font-weight:800}
.seg{position:relative;display:flex;gap:6px}
.opt{flex:1;position:relative;padding:11px 0 9px;border-radius:15px;text-align:center;border:1px solid var(--line);background:var(--g1);color:var(--tx);font:800 15px Vazirmatn;transition:.25s}
.opt small{display:block;font-size:9.5px;font-weight:400;color:var(--mut);margin-top:1px}
.opt.on{border-color:transparent;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 20px rgba(109,141,255,.4);transform:translateY(-2px)}
.opt.on small{color:#e6e9ff}
.opt .tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:8.5px;font-weight:800;color:#06302a;background:var(--c);padding:1px 7px;border-radius:99px}
.step{display:flex;align-items:center;gap:12px}
.sbtn{width:46px;height:46px;border-radius:15px;border:1px solid var(--line);background:var(--g2);color:#fff;font:400 24px Vazirmatn;display:grid;place-items:center;transition:transform .12s}
.sbtn:active{transform:scale(.88)}
.dots{flex:1;display:flex;justify-content:center;gap:5px;flex-wrap:wrap;min-height:38px;align-items:center}
.dots i{font-style:normal;font-size:20px;transition:.3s;filter:grayscale(1) opacity(.25)}
.dots i.on{filter:none;transform:scale(1.1)}
.inf{border:1px solid var(--line);background:var(--g1);color:var(--tx);border-radius:15px;padding:0 14px;height:46px;font:800 20px Vazirmatn;transition:.25s}
.inf.on{border-color:transparent;background:linear-gradient(135deg,var(--c),#3b8cff);color:#04221d;box-shadow:0 6px 20px rgba(46,230,197,.4)}
.recp{margin-top:22px;padding:15px 16px;border-radius:20px;background:rgba(255,255,255,.045);border:1px dashed rgba(255,255,255,.18);font-size:13px}
.recp div{display:flex;justify-content:space-between;padding:4px 0;color:var(--mut)}
.recp div b{color:var(--tx);font-weight:600}
.recp .sv{color:var(--c)}.recp .sv b{color:var(--c)}
.recp .tt{margin-top:8px;padding-top:11px;border-top:1px solid var(--line);align-items:baseline}
.recp .tt span{color:var(--tx)}
.recp .tt b{font-size:25px;font-weight:900}
.go{position:relative;overflow:hidden;width:100%;margin-top:16px;border:0;padding:17px;border-radius:19px;font:900 16px Vazirmatn;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 12px 32px rgba(140,108,255,.5);transition:transform .15s}
.go:active{transform:scale(.97)}
.go::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(130%);animation:shine 3s infinite}
.note{text-align:center;color:var(--mut);font-size:11px;margin-top:11px}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
</style>
</head>
<body>
<canvas id="bg"></canvas><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
<div id="splash"><div class="orb">🛡️</div><b id="spName"></b></div>

<header>
  <div class="logo">⚡</div>
  <div><h1 id="shop">فروشگاه</h1><p id="hello">یه پلن انتخاب کن</p></div>
  <div class="live"><i></i>آنلاین</div>
</header>

<div class="hero">
  <h2>اینترنت آزاد، بدون دردسر</h2>
  <p>پلنت رو انتخاب کن، همون لحظه تحویل می‌گیری.</p>
  <div class="perks">
    <div class="perk"><b>⚡</b>تحویل آنی</div>
    <div class="perk"><b>🔒</b>اتصال امن</div>
    <div class="perk"><b>💬</b>پشتیبانی</div>
  </div>
</div>

<div class="tabs" id="tabs"><div class="ind" id="ind"></div></div>
<div class="list" id="list"></div>

<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ee6c5"/><stop offset="1" stop-color="#b46cff"/></linearGradient></defs></svg>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet">
  <div class="grab" id="grab"></div>
  <div class="sh-top"><div class="ring" id="sRing"></div><div><h2 id="sName"></h2><p id="sSub"></p></div></div>
  <div id="durBox"><div class="lbl"><span>⏳ مدت اشتراک</span><b id="durT"></b></div><div class="seg" id="dur"></div></div>
  <div id="usrBox"><div class="lbl"><span>👥 تعداد کاربر</span><b id="usrT"></b></div>
    <div class="step"><button class="sbtn" id="plus">+</button><div class="dots" id="dots"></div><button class="sbtn" id="minus">−</button><button class="inf" id="inf">♾</button></div></div>
  <div class="recp" id="recp"></div>
  <button class="go" id="go">ادامه و پرداخت</button>
  <div class="note">🔐 پرداخت امن، داخل خود ربات</div>
</div>
<canvas id="fx"></canvas>

<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#07080f');tg.setBackgroundColor('#07080f');tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
const $=id=>document.getElementById(id);
const hap=t=>{try{tg.HapticFeedback.impactOccurred(t||'light')}catch(e){}};
const sel_h=()=>{try{tg.HapticFeedback.selectionChanged()}catch(e){}};
function decode(){try{const d=new URLSearchParams(location.search).get('d');if(!d)return null;
  const s=atob(d.replace(/-/g,'+').replace(/_/g,'/'));return JSON.parse(new TextDecoder().decode(Uint8Array.from(s,c=>c.charCodeAt(0))))}catch(e){return null}}
const D=decode()||{b:'',s:'Sixty Vpn',mx:10,pu:40,pl:20,pn:5,m:[1,2,3,6,12],on:1,p:[
 [1,'1 ماهه | 10 گیگ',30,10,100000,'direct'],[2,'1 ماهه | 30 گیگ',30,30,170000,'direct'],[3,'1 ماهه | 50 گیگ',30,50,230000,'direct'],[4,'2 ماهه | 200 گیگ',60,200,600000,'direct'],
 [5,'1 ماهه | 20 گیگ',30,20,210000,'tunnel'],[6,'1 ماهه | 60 گیگ',30,60,420000,'tunnel']]};
const toFa=n=>Number(n).toLocaleString('fa-IR');
const fmt=n=>toFa(n)+' تومان';
const gbT=g=>g>0?toFa(+g)+' گیگ':'♾ نامحدود';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS={direct:['🌐','مستقیم'],tunnel:['💎','تانل']};

function calc(unit,mult,u){
  const per=D.pu/100,mx=D.mx;
  const f=u===0?(1+per*(mx-1))*(1+D.pl/100):1+per*(u-1);
  const raw=unit*mult*f,disc=mult>=3?raw*D.pn/100:0;
  const rd=x=>x>=1000?Math.round(x/100)*100:Math.round(x);
  return{total:rd(raw-disc),raw:rd(raw),save:rd(disc),base:unit*mult,extra:rd(raw-unit*mult)};
}
function countTo(el,to,dur=500){
  const from=+el.dataset.v||0;el.dataset.v=to;const t0=performance.now();
  (function s(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmt(Math.round(from+(to-from)*e));k<1&&requestAnimationFrame(s)})(t0);
}
function ring(p,big){
  const unl=!(p[3]>0),maxG=Math.max(...D.p.map(x=>x[3]),1);
  const pct=unl?1:Math.max(.08,p[3]/maxG);
  return `<svg viewBox="0 0 64 64"><circle class="bgc" cx="32" cy="32" r="28"/><circle class="fg" cx="32" cy="32" r="28" data-pct="${pct}"/></svg><span>${unl?'♾':toFa(+p[3])}<small>${unl?'نامحدود':'گیگ'}</small></span>`;
}
function growRings(root){requestAnimationFrame(()=>setTimeout(()=>root.querySelectorAll('.fg').forEach(c=>c.style.strokeDashoffset=176*(1-c.dataset.pct)),60))}

let cats=[...new Set(D.p.map(p=>p[5]))],cat=cats[0],cur=null,sel={m:1,u:1};
function renderTabs(){
  const t=$('tabs');t.querySelectorAll('.tab').forEach(x=>x.remove());
  cats.forEach(c=>{const b=document.createElement('button');b.className='tab'+(c===cat?' on':'');b.dataset.c=c;b.textContent=(CATS[c]||['✨',c]).join(' ');t.appendChild(b)});
  t.style.display=cats.length>1?'flex':'none';
  $('ind').style.width=`calc(${100/cats.length}% - 5px)`;
  $('ind').style.transform=`translateX(${-cats.indexOf(cat)*100}%)`;
}
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b||b.dataset.c===cat)return;cat=b.dataset.c;sel_h();renderTabs();renderList()};

function renderList(){
  const L=$('list'),ps=D.p.filter(p=>p[5]===cat);
  if(!ps.length){L.innerHTML='<div class="empty">فعلاً پلنی نیست</div>';return}
  let best=-1,bv=1e18;ps.forEach(p=>{if(p[3]>0&&p[2]>0){const v=p[4]/p[3];if(v<bv){bv=v;best=p[0]}}});
  if(ps.filter(p=>p[3]>0).length<2)best=-1;
  L.innerHTML=ps.map((p,i)=>`<div class="plan${p[0]===best?' best':''}" style="animation-delay:${i*70}ms" data-i="${p[0]}">
    ${p[0]===best?'<span class="badge">🔥 به‌صرفه‌ترین</span>':''}
    <div class="ring">${ring(p)}</div>
    <div class="info"><b>${esc(p[1])}</b><div class="chips"><span class="chip">⏳ ${p[2]?toFa(p[2])+' روز':'بدون انقضا'}</span>${p[3]>0?`<span class="chip">${toFa(Math.round(p[4]/p[3]))} ت / گیگ</span>`:''}</div></div>
    <div class="price"><b>${toFa(p[4])}</b><small>تومان</small></div></div>`).join('');
  growRings(L);
}
$('list').onclick=e=>{const c=e.target.closest('.plan');if(c)openSheet(+c.dataset.i)};

function openSheet(id){
  cur=D.p.find(p=>p[0]===id);sel={m:1,u:1};hap('medium');
  $('sName').textContent=cur[1];
  $('sSub').textContent=`${cur[2]?toFa(cur[2])+' روز':'بدون انقضا'} • ${gbT(cur[3])} • حجم ثابته`;
  $('sRing').innerHTML=ring(cur);
  const on=D.on!==0;
  $('durBox').style.display=(on&&cur[2])?'block':'none';
  $('usrBox').style.display=on?'block':'none';
  drawSheet(true);
  $('ov').classList.add('on');$('sheet').classList.add('on');growRings($('sheet'));
}
function closeSheet(){$('ov').classList.remove('on');$('sheet').classList.remove('on');$('sheet').style.transform=''}
$('ov').onclick=closeSheet;

function drawSheet(first){
  const on=D.on!==0,r=on?calc(cur[4],sel.m,sel.u):{total:cur[4],save:0,extra:0,base:cur[4]};
  if(cur[2]){
    $('dur').innerHTML=D.m.map(m=>`<button class="opt ${m===sel.m?'on':''}" data-m="${m}">${m>=3&&D.pn?`<span class="tag">${toFa(D.pn)}٪−</span>`:''}${toFa(cur[2]*m)}<small>روز</small></button>`).join('');
    $('durT').textContent=toFa(cur[2]*sel.m)+' روز';
  }
  const mx=D.mx;
  $('dots').innerHTML=Array.from({length:mx},(_,i)=>`<i class="${sel.u===0||i<sel.u?'on':''}">👤</i>`).join('');
  $('inf').classList.toggle('on',sel.u===0);
  $('usrT').textContent=sel.u===0?'نامحدود':toFa(sel.u)+' کاربر';
  $('recp').innerHTML=`<div><span>قیمت پایه ${cur[2]?'× '+toFa(sel.m):''}</span><b>${fmt(r.base)}</b></div>`+
    (r.extra>0?`<div><span>کاربر اضافه</span><b>+ ${fmt(r.extra)}</b></div>`:'')+
    (r.save>0?`<div class="sv"><span>🎁 تخفیف مدت</span><b>− ${fmt(r.save)}</b></div>`:'')+
    `<div class="tt"><span>مبلغ نهایی</span><b id="tot" data-v="${first?0:($('tot')?+$('tot').dataset.v:0)}"></b></div>`;
  countTo($('tot'),r.total,first?700:380);
}
$('dur').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;sel.m=+b.dataset.m;sel_h();drawSheet()};
$('plus').onclick=()=>{sel.u=sel.u===0?D.mx:Math.min(D.mx,sel.u+1);hap();drawSheet()};
$('minus').onclick=()=>{sel.u=sel.u===0?D.mx:Math.max(1,sel.u-1);hap();drawSheet()};
$('inf').onclick=()=>{sel.u=sel.u===0?1:0;hap('medium');drawSheet()};

// drag-to-close
(()=>{let y0=null,dy=0;const g=$('grab'),s=$('sheet');
 g.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;s.classList.add('drag')},{passive:true});
 g.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);s.style.transform=`translateY(${dy}px)`},{passive:true});
 g.addEventListener('touchend',()=>{s.classList.remove('drag');if(dy>110)closeSheet();else s.style.transform='';y0=null;dy=0});})();

// confetti
function confetti(){
  const c=$('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#6d8dff','#b46cff','#2ee6c5','#ffc65c','#fff'];
  const P=Array.from({length:70},()=>({x:innerWidth/2,y:innerHeight*.78,vx:(Math.random()-.5)*14,vy:-Math.random()*16-5,s:Math.random()*7+3,c:cols[Math.random()*5|0],r:Math.random()*6}));
  let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.5;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++f<60)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})();
}
$('go').onclick=()=>{
  hap('heavy');confetti();
  const on=D.on!==0,m=on?sel.m:1,u=on?sel.u:1;
  const link=`https://t.me/${D.b}?start=mp_${cur[0]}_${m}_${u}`;
  setTimeout(()=>{if(tg&&D.b){tg.openTelegramLink(link);setTimeout(()=>tg.close(),200)}else if(D.b)location.href=link;else alert('نمونه‌ی نمایشی — داخل ربات کار می‌کنه')},650);
};
if(tg&&tg.BackButton)tg.BackButton.onClick(closeSheet);

// particle network background
(()=>{const c=$('bg'),x=c.getContext('2d');let w,h,P;
 const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight;P=Array.from({length:38},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}))};rs();addEventListener('resize',rs);
 (function a(){x.clearRect(0,0,w,h);P.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;
  x.fillStyle='rgba(160,180,255,.5)';x.beginPath();x.arc(p.x,p.y,1.4,0,6.3);x.fill();
  for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<110){x.strokeStyle=`rgba(140,160,255,${.16*(1-d/110)})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}});
  requestAnimationFrame(a)})();})();

// init
$('shop').textContent=D.s||'فروشگاه';$('spName').textContent=D.s||'';
const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
if(u&&u.first_name)$('hello').textContent='سلام '+u.first_name+' 👋';
renderTabs();renderList();
setTimeout(()=>$('splash').classList.add('off'),1100);
